version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: interclue-postgres
    restart: always
    environment:
      POSTGRES_USER: interclue_user
      POSTGRES_PASSWORD: interclue_password
      POSTGRES_DB: interclue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql

  redis:
    image: redis:7-alpine
    container_name: interclue-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interclue-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://interclue_user:interclue_password@postgres:5432/interclue
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=interclue-super-secret-key-production-ready-2026-secure-jwt
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
